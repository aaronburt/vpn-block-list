name: Deploy Command Builder

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'asn.json'
      - 'crowdsec/docker_crowdsec_ban_import.sh'
      - 'scripts/build-manifest.py'
      - '.github/workflows/pages.yml'
  # The blocklist bot pushes with GITHUB_TOKEN, which does not trigger push events,
  # so redeploy whenever the update workflow finishes.
  workflow_run:
    workflows: ['Update VPN Blocklist']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Build Manifest
        run: python3 scripts/build-manifest.py --out public/manifest.json

      - name: Validate Outputs and Manifest
        run: python3 scripts/validate_outputs.py --manifest public/manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Name the artifact per attempt: re-running a job keeps the earlier attempt's
      # artifact, and deploy-pages refuses to pick between two with the same name.
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}

      # The Pages API sometimes cannot see an artifact that was uploaded moments
      # earlier, so retry the deploy once after a short wait before failing the job.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait Before Retrying Deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry Deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
