name: Update VPN Blocklist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'asn.json'
      - 'scripts/build-blocklist.sh'
      - 'scripts/build-crowdsec.sh'
      - 'scripts/scan-overlaps.py'
      - 'scripts/validate_outputs.py'
      - 'crowdsec/docker_crowdsec_ban_import.sh'

permissions:
  contents: write

jobs:
  update-blocklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Make Script Executable
        run: chmod +x scripts/build-blocklist.sh

      - name: Run Build Script
        run: ./scripts/build-blocklist.sh

      - name: Run CrowdSec Generator
        run: |
          chmod +x scripts/build-crowdsec.sh
          ./scripts/build-crowdsec.sh

      - name: Validate Outputs
        run: python3 scripts/validate_outputs.py

      - name: Stage Output Files
        run: git add -A vpn-blocklist*.txt individual_blocklists/ lists/ crowdsec/

      - name: Check for Changes
        id: git-diff
        run: |
          git diff --cached --quiet -- 'vpn-blocklist*.txt' individual_blocklists/ lists/ crowdsec/ || echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit and Push Changes
        if: steps.git-diff.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-update VPN blocklist"
          git push

      - name: Purge jsDelivr Cache
        if: steps.git-diff.outputs.changes == 'true'
        run: |
          for file in vpn-blocklist*.txt; do
            curl -s "https://purge.jsdelivr.net/gh/aaronburt/vpn-block-list@main/$file"
          done
          curl -s https://purge.jsdelivr.net/gh/aaronburt/vpn-block-list@main/crowdsec/decisions.csv
          curl -s https://purge.jsdelivr.net/gh/aaronburt/vpn-block-list@main/crowdsec/docker_crowdsec_ban_import.sh
          for file in lists/*.txt; do
            curl -s "https://purge.jsdelivr.net/gh/aaronburt/vpn-block-list@main/$file"
          done
          for file in individual_blocklists/*.txt; do
            filename=$(basename "$file")
            curl -s "https://purge.jsdelivr.net/gh/aaronburt/vpn-block-list@main/individual_blocklists/$filename"
          done
